<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Liquide vortex — lignes de courant lisses (Euler 3D)</title>
<style>
  body { margin:0; overflow:hidden; background:#02040a; font-family:monospace; }
  #info {
    position:absolute; top:12px; left:12px; color:#9fd; font-size:13px;
    background:rgba(0,0,0,0.55); padding:10px 14px; border-radius:8px;
    border:1px solid rgba(120,220,255,0.25); line-height:1.5; pointer-events:none;
  }
  #info b { color:#6ef; }
  #omega { color:#ff5a8a; font-weight:bold; }
  #controls { position:absolute; bottom:14px; left:12px; color:#6a9; font-size:12px; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="info">
  <b>Liquide — vortex & singularité locale</b><br>
  |ω(0)| → <span id="omega">0</span> (croît, Thm 1.1)<br>
  ‖u‖<sub>∞</sub> bornée · div u = 0 (approx.)
</div>
<div id="controls">Souris : rotation · Molette : zoom · Espace : pause</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// SCÈNE
// ============================================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02040a, 0.05);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(3.4, 2.1, 4.2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x02040a, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.5;
controls.maxDistance = 15;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.30;

// ============================================================
// CHAMP DE VITESSE ANALYTIQUE PROPRE
// Vortex concentré près du pôle +y (l'"origine" de la singularité).
// u = ω(d) * e_θ + attraction méridienne, avec clamp borné.
// Pas de bruit carré : les lignes de courant sont lisses.
// ============================================================
const MAX_SPEED = 1.6;

// Coordonnées cylindriques autour de l'axe y
// d = distance angulaire au pôle ; e_θ = tangente azimutale
const _v = new THREE.Vector3();

function velocityAt(x, y, z, out) {
  const r = Math.hypot(x, y, z) + 1e-6;
  const rho = Math.hypot(x, z) + 1e-6;        // distance à l'axe y
  const cosPhi = THREE.MathUtils.clamp(y / r, -1, 1);
  const distPole = Math.acos(cosPhi);         // 0 au pôle nord

  // vorticité locale qui explose au pôle
  const omega = 2.0 / (0.05 + distPole*distPole + 1e-3);

  // tangente azimutale e_θ = (-z, 0, x)/rho
  const tx = -z / rho, tz = x / rho;

  // composante tangentielle du vortex (tourne autour de y)
  let vx = tx * omega * 0.20;
  let vz = tz * omega * 0.20;
  let vy = 0;

  // attraction méridienne vers le pôle (convergence du vortex)
  // méridien = direction vers +y le long de la sphère
  const mx = x / r, my = y / r, mz = z / r;
  // projecteur sur la tangente au méridien : m - (m·ŷ)ŷ  (vers le haut si y<r)
  let merX = mx, merY = my - 1.0, merZ = mz;
  const merLen = Math.hypot(merX, merY, merZ) + 1e-6;
  merX/=merLen; merY/=merLen; merZ/=merLen;
  const pull = 0.85 / (0.20 + distPole);
  vx += merX * pull * 0.35;
  vy += merY * pull * 0.35;
  vz += merZ * pull * 0.35;

  // ---- incompressibilité approx. : atténue la composante radiale ----
  const nx = x/r, ny = y/r, nz = z/r;
  const radialComp = vx*nx + vy*ny + vz*nz;
  const keep = 0.15; // garde un peu de convergence
  vx -= radialComp * (1-keep) * nx;
  vy -= radialComp * (1-keep) * ny;
  vz -= radialComp * (1-keep) * nz;

  // ---- CLAMP : vitesse bornée (Théorème 1.1) ----
  const sp = Math.hypot(vx, vy, vz);
  if (sp > MAX_SPEED) { const k = MAX_SPEED/sp; vx*=k; vy*=k; vz*=k; }

  out.set(vx, vy, vz);
  return out;
}

// ============================================================
// PARTICULES (liquide) — nuage de points lumineux
// ============================================================
const N = 6000;
const pos = new Float32Array(N*3);
const seed = new Float32Array(N);
const life = new Float32Array(N);
const sizeArr = new Float32Array(N);
const hueArr  = new Float32Array(N);
const alphaArr= new Float32Array(N);

const R = 1.0;

function randShell(rMin, rMax) {
  const u = Math.random();
  const r = Math.cbrt(u*(rMax**3 - rMin**3) + rMin**3);
  const z = Math.random()*2 - 1;
  const t = Math.random()*Math.PI*2;
  const s = Math.sqrt(1 - z*z);
  return [r*s*Math.cos(t), r*z, r*s*Math.sin(t)];
}

function spawn(i, near) {
  let p;
  if (near) {
    const r = 0.12 + Math.random()*0.45;
    const dir = new THREE.Vector3(
      Math.random()-0.5, Math.random()*0.5+0.5, Math.random()-0.5
    ).normalize();
    p = dir.multiplyScalar(r);
  } else {
    p = new THREE.Vector3(...randShell(0.3, 1.5));
  }
  pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
  seed[i]=Math.random()*10;
  life[i]=0.5 + Math.random()*0.5;
  sizeArr[i]=0.6 + Math.random()*1.3;
}
for (let i=0;i<N;i++) spawn(i, Math.random()<0.35);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('aSize',   new THREE.BufferAttribute(sizeArr,1));
geo.setAttribute('aHue',    new THREE.BufferAttribute(hueArr,1));
geo.setAttribute('aAlpha',  new THREE.BufferAttribute(alphaArr,1));

const vShader = /* glsl */`
  attribute float aSize;
  attribute float aHue;
  attribute float aAlpha;
  varying float vHue;
  varying float vAlpha;
  void main() {
    vHue = aHue; vAlpha = aAlpha;
    vec4 mv = modelViewMatrix * vec4(position,1.0);
    gl_PointSize = aSize * (240.0 / -mv.z);
    gl_Position = projectionMatrix * mv;
  }
`;
const fShader = /* glsl */`
  varying float vHue; varying float vAlpha;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if (d > 0.5) discard;
    float core = smoothstep(0.5, 0.0, d);
    float glow = pow(1.0 - d*2.0, 2.2);
    vec3 cyan    = vec3(0.05,0.75,1.0);
    vec3 magenta = vec3(1.0,0.15,0.55);
    vec3 yellow  = vec3(1.0,0.85,0.35);
    float h = clamp(vHue,0.0,1.0);
    vec3 col = mix(cyan, magenta, smoothstep(0.0,0.7,h));
    col = mix(col, yellow, smoothstep(0.75,1.0,h));
    float a = (core*0.3 + glow*0.75) * vAlpha;
    gl_FragColor = vec4(col*(0.6+glow*1.6), a);
  }
`;
const mat = new THREE.ShaderMaterial({
  vertexShader:vShader, fragmentShader:fShader,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);

// ============================================================
// LIGNES DE COURANT LISSES
// Une Line continue par "filet de fluide". Pas de segments indexés
// (c'est ce qui créait les carrés). Chaque ligne est un ruban
// polyline continu qui suit le champ de vitesse.
// ============================================================
const TRAILS = 380;          // nb de lignes
const LEN = 64;              // nb de points par ligne (continuité lisse)
const trailPos = new Float32Array(TRAILS*LEN*3);
const trailCol = new Float32Array(TRAILS*LEN*3);
const head = new Float32Array(TRAILS*3);
const tLife = new Float32Array(TRAILS);
const tSeed = new Float32Array(TRAILS);

for (let i=0;i<TRAILS;i++){
  const p = new THREE.Vector3(...randShell(0.25,1.35));
  head[i*3]=p.x; head[i*3+1]=p.y; head[i*3+2]=p.z;
  tLife[i]=Math.random();
  tSeed[i]=Math.random()*10;
  for (let j=0;j<LEN;j++){
    const a=(i*LEN+j)*3;
    trailPos[a]=p.x; trailPos[a+1]=p.y; trailPos[a+2]=p.z;
  }
}

const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos,3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol,3));

// index : CHAQUE ligne est une polyline continue (pas de segments croisés)
const idx = [];
for (let i=0;i<TRAILS;i++){
  for (let j=0;j<LEN-1;j++){
    const a = i*LEN + j;
    idx.push(a, a+1);
  }
}
trailGeo.setIndex(idx);

const trailMat = new THREE.LineBasicMaterial({
  vertexColors:true, transparent:true, opacity:0.75,
  blending:THREE.AdditiveBlending, depthWrite:false
});
const trailLines = new THREE.LineSegments(trailGeo, trailMat);
trailLines.frustumCulled = false;
scene.add(trailLines);

// ============================================================
// HALO SINGULARITÉ
// ============================================================
const ORIGIN = new THREE.Vector3(0,1,0);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  color:0xff3377, transparent:true, opacity:0.8,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
halo.position.copy(ORIGIN);
scene.add(halo);
const halo2 = new THREE.Sprite(new THREE.SpriteMaterial({
  color:0x33ccff, transparent:true, opacity:0.4,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
halo2.position.copy(ORIGIN);
scene.add(halo2);

// ============================================================
// ANIMATION
// ============================================================
const clock = new THREE.Clock();
const omegaLabel = document.getElementById('omega');
let simTime=0, paused=false, singularity=1;

const _v2 = new THREE.Vector3();
const _p = new THREE.Vector3();
const tmpCol = new THREE.Color();

function heatAt(x,y,z){
  const r = Math.hypot(x,y,z)+1e-6;
  const dP = Math.acos(THREE.MathUtils.clamp(y/r,-1,1));
  return THREE.MathUtils.clamp(1 - dP/0.85, 0, 1);
}

function animate(){
  requestAnimationFrame(animate);
  if (paused){ controls.update(); renderer.render(scene,camera); return; }

  const dt = Math.min(clock.getDelta(), 0.033);
  simTime += dt;
  singularity = 1.0 + 2.5*(0.5+0.5*Math.sin(simTime*0.5));
  omegaLabel.textContent = (50*singularity).toFixed(0);

  const pulse = 1.0+0.4*Math.sin(simTime*3.5);
  halo.scale.setScalar(0.35*pulse*(0.8+singularity*0.25));
  halo2.scale.setScalar(0.9*pulse*(0.8+singularity*0.15));
  halo.material.opacity = 0.45+0.4*Math.sin(simTime*2.2);
  halo2.material.opacity= 0.25+0.25*Math.sin(simTime*1.7+1.0);

  // ---- particules ----
  for (let i=0;i<N;i++){
    _p.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
    velocityAt(_p.x,_p.y,_p.z,_v2);
    pos[i*3]   += _v2.x*dt;
    pos[i*3+1] += _v2.y*dt;
    pos[i*3+2] += _v2.z*dt;
    _p.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
    const r=_p.length();
    life[i] -= dt*(0.10 + 0.85*heatAt(_p.x,_p.y,_p.z));
    if (life[i]<=0 || r<0.08 || r>2.3){ spawn(i, Math.random()<0.4); continue; }
    const h=heatAt(_p.x,_p.y,_p.z);
    sizeArr[i]  = (0.5 + h*1.6)*(1.0+0.4*Math.sin(simTime*2.0+seed[i]));
    hueArr[i]   = h;
    alphaArr[i] = 0.35 + 0.55*h;
  }
  geo.attributes.position.needsUpdate=true;
  geo.attributes.aSize.needsUpdate=true;
  geo.attributes.aHue.needsUpdate=true;
  geo.attributes.aAlpha.needsUpdate=true;

  // ---- lignes de courant lisses ----
  for (let i=0;i<TRAILS;i++){
    // avance la tête
    let hx=head[i*3], hy=head[i*3+1], hz=head[i*3+2];
    velocityAt(hx,hy,hz,_v2);
    // pas plus fin pour lisser
    hx += _v2.x*dt; hy += _v2.y*dt; hz += _v2.z*dt;
    head[i*3]=hx; head[i*3+1]=hy; head[i*3+2]=hz;

    // décale les points de la polyline (suivi en cascade)
    for (let j=LEN-1;j>0;j--){
      const a=(i*LEN+j)*3, b=(i*LEN+j-1)*3;
      trailPos[a]   = trailPos[b];
      trailPos[a+1] = trailPos[b+1];
      trailPos[a+2] = trailPos[b+2];
    }
    const a0=(i*LEN)*3;
    trailPos[a0]=hx; trailPos[a0+1]=hy; trailPos[a0+2]=hz;

    // vie / recyclage
    const r=Math.hypot(hx,hy,hz);
    tLife[i] -= dt*(0.06 + 0.35*(1-Math.min(r,1.0)));
    if (tLife[i]<=0 || r<0.1 || r>2.3){
      const p = new THREE.Vector3(...randShell(0.3,1.4));
      head[i*3]=p.x; head[i*3+1]=p.y; head[i*3+2]=p.z;
      for (let j=0;j<LEN;j++){
        const a=(i*LEN+j)*3;
        trailPos[a]=p.x; trailPos[a+1]=p.y; trailPos[a+2]=p.z;
      }
      tLife[i]=Math.random();
    }

    // couleurs dégradées douces le long de la ligne (queue -> tête)
    for (let j=0;j<LEN;j++){
      const a=(i*LEN+j)*3;
      const h=heatAt(trailPos[a],trailPos[a+1],trailPos[a+2]);
      // cyan -> magenta -> jaune
      tmpCol.setHSL(0.58 - 0.48*h, 0.9, 0.30 + 0.45*h);
      const t = j/(LEN-1);
      const fade = 0.08 + 0.92*Math.pow(t, 1.6); // queue atténuée
      trailCol[a]   = tmpCol.r*fade;
      trailCol[a+1] = tmpCol.g*fade;
      trailCol[a+2] = tmpCol.b*fade;
    }
  }
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.color.needsUpdate=true;

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e)=>{
  if (e.code==='Space'){ paused=!paused; e.preventDefault(); }
});
</script>
</body>
</html>
