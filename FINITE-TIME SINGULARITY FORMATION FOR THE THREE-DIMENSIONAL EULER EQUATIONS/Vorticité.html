<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vortex sur sphère — inspiré du papier Euler 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #05060a; font-family: monospace; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #9fd; font-size: 13px;
    background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(120,220,255,0.25); line-height: 1.5;
  }
  #info b { color: #6ef; }
  #controls { position: absolute; bottom: 14px; left: 12px; color: #9fd; font-size: 12px; }
</style>
</head>
<body>
<div id="info">
  <b>Vortex / singularité locale</b><br>
  Vorticité concentrée près du pôle « origine »<br>
  |ω(0)| augmente → <span id="omega">0</span><br>
  ‖u‖<sub>∞</sub> reste bornée (Théorème 1.1)
</div>
<div id="controls">Souris : rotation · Molette : zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Scène ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.06);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.6, 1.8, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.8;
controls.maxDistance = 8;

// ---------- Lumières ----------
scene.add(new THREE.AmbientLight(0x334466, 0.9));
const key = new THREE.DirectionalLight(0x88ccff, 1.4);
key.position.set(3, 4, 5);
scene.add(key);
const rim = new THREE.PointLight(0xff4488, 40, 12);
rim.position.set(-2.5, -1.5, -2);
scene.add(rim);

// ---------- Sphère filaire ----------
const R = 1.0;
const sphereGeo = new THREE.SphereGeometry(R, 64, 48);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x1a3b5c, wireframe: true, transparent: true, opacity: 0.28
});
const sphereWire = new THREE.Mesh(sphereGeo, wireMat);
scene.add(sphereWire);

// Sphère interne translucide pour la profondeur
const shell = new THREE.Mesh(
  new THREE.SphereGeometry(R*0.995, 64, 48),
  new THREE.MeshPhysicalMaterial({
    color: 0x0a1620, roughness: 0.35, metalness: 0.1,
    transparent: true, opacity: 0.55, side: THREE.FrontSide
  })
);
scene.add(shell);

// Grille de méridiens/parallèles subtile (déjà via wireframe) + équateur
const eqCurve = [];
for (let i = 0; i <= 128; i++) {
  const a = i/128 * Math.PI*2;
  eqCurve.push(new THREE.Vector3(Math.cos(a)*R*1.001, 0, Math.sin(a)*R*1.001));
}
const eq = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(eqCurve),
  new THREE.LineBasicMaterial({ color: 0x2a5a7a, transparent:true, opacity:0.5 })
);
scene.add(eq);

// ---------- Pôle "origine" (singularité) ----------
const originDir = new THREE.Vector3(0, 1, 0); // pôle nord
const originPos = originDir.clone().multiplyScalar(R);

const glowMat = new THREE.SpriteMaterial({
  color: 0xff3366, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const glow = new THREE.Sprite(glowMat);
glow.position.copy(originPos);
glow.scale.set(0.5, 0.5, 1);
scene.add(glow);

// halo
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  color: 0x66ccff, transparent:true, opacity:0.4,
  blending: THREE.AdditiveBlending, depthWrite:false
}));
halo.position.copy(originPos);
halo.scale.set(1.2,1.2,1);
scene.add(halo);

// ---------- Lignes de vortex (tubes) ----------
// On génère des hélices qui spiralent autour de l'axe vers le pôle (vortex)
const vortexGroup = new THREE.Group();
scene.add(vortexGroup);

const NUM_LINES = 26;
const vColors = [0x00e5ff, 0x3aa0ff, 0x9b5cff, 0xff4d9a];

function buildVortexLine(phase, k) {
  const pts = [];
  const turns = 3.2 + (k%4)*0.35;
  const N = 220;
  for (let i = 0; i < N; i++) {
    const t = i/(N-1);            // 0 -> 1 (bas vers pôle)
    // latitude phi : de -π/2 à +π/2 (vers le pôle nord = singularité)
    const phi = -Math.PI/2 + t * Math.PI * 0.92; // s'arrête un peu avant le pôle
    // angle qui tourne de plus en plus vite près du pôle (torsion)
    const twist = phase + t * turns * Math.PI * 2 + Math.pow(t, 2.2) * 4.0;
    const rad = R * 1.015 * Math.cos(phi);
    const x = rad * Math.cos(twist);
    const z = rad * Math.sin(twist);
    const y = R * 1.015 * Math.sin(phi);
    // rétractation radiale près du pôle (convergence)
    const conv = 1 - 0.35 * Math.pow(t, 3.0);
    pts.push(new THREE.Vector3(x*conv, y, z*conv));
  }
  return pts;
}

const lineMeshes = [];
for (let k = 0; k < NUM_LINES; k++) {
  const phase = (k / NUM_LINES) * Math.PI * 2;
  const pts = buildVortexLine(phase, k);
  const curve = new THREE.CatmullRomCurve3(pts);
  const tubeGeo = new THREE.TubeGeometry(curve, 160, 0.0075, 6, false);
  const col = new THREE.Color(vColors[k % vColors.length]);
  const mat = new THREE.MeshBasicMaterial({
    color: col, transparent: true, opacity: 0.75,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const mesh = new THREE.Mesh(tubeGeo, mat);
  mesh.userData = { phase, k, curve };
  vortexGroup.add(mesh);
  lineMeshes.push(mesh);
}

// ---------- Particules (champ de vitesse) ----------
// Simule un champ u : vitesse tangentielle autour de l'axe + composante méridienne vers le pôle.
// La vitesse reste bornée ; la vorticité (rotation locale) augmente près du pôle.
const P_COUNT = 1400;
const pPos = new Float32Array(P_COUNT * 3);
const pVel = new Float32Array(P_COUNT * 3);
const pSeed = new Float32Array(P_COUNT);
const pLife = new Float32Array(P_COUNT);

function randShellPoint() {
  const u = Math.random()*2 - 1;
  const theta = Math.random()*Math.PI*2;
  const r = Math.sqrt(1 - u*u);
  return new THREE.Vector3(r*Math.cos(theta), u, r*Math.sin(theta));
}

const tmpA = new THREE.Vector3();
const tmpB = new THREE.Vector3();
const axis = new THREE.Vector3(0,1,0);

// champ de vitesse inspiré : u = ω_s × x_perp + attraction vers le pôle
function velocityAt(pos, time, out) {
  // distance angulaire au pôle
  const cosPhi = THREE.MathUtils.clamp(pos.y / pos.length(), -1, 1);
  const distPole = Math.acos(cosPhi); // 0 près du pôle
  // intensité de rotation croissante près du pôle (vorticité locale)
  const omega = 1.2 / (0.18 + distPole*distPole + 1e-3);
  // axe de rotation local = radial autour de l'axe y projeté
  const radial = new THREE.Vector3(pos.x, 0, pos.z);
  const rLen = radial.length() + 1e-6;
  const tangent = new THREE.Vector3(-radial.z/rLen, 0, radial.x/rLen);
  // composante tangentielle (vortex)
  out.copy(tangent).multiplyScalar(omega * 0.25);
  // composante méridienne : remontée vers le pôle (convergence du vortex)
  const meridian = new THREE.Vector3(0,1,0).sub(pos.clone().normalize().multiplyScalar(pos.clone().normalize().y)).normalize();
  const pull = 0.55 / (0.25 + distPole);
  out.addScaledVector(meridian, pull * 0.35);
  // léger bruit oscillant
  out.x += 0.15*Math.sin(time*1.7 + pos.y*5.0);
  out.z += 0.15*Math.cos(time*1.3 + pos.x*5.0);
  return out;
}

function respawn(i) {
  const p = randShellPoint().multiplyScalar(R * (0.55 + Math.random()*0.42));
  pPos[i*3] = p.x; pPos[i*3+1] = p.y; pPos[i*3+2] = p.z;
  pSeed[i] = Math.random()*10;
  pLife[i] = Math.random();
}

for (let i = 0; i < P_COUNT; i++) respawn(i);

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

// couleur par particule en fonction de la proximité au pôle
const pCol = new Float32Array(P_COUNT*3);
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.018, vertexColors: true, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const points = new THREE.Points(pGeo, pMat);
scene.add(points);

// ---------- Étoiles de fond ----------
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(800*3);
for (let i=0;i<800;i++){
  const v = randShellPoint().multiplyScalar(6 + Math.random()*18);
  starPos[i*3]=v.x; starPos[i*3+1]=v.y; starPos[i*3+2]=v.z;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
  color:0x224466, size:0.05, transparent:true, opacity:0.6, depthWrite:false
})));

// ---------- Boucle d'animation ----------
const clock = new THREE.Clock();
const omegaLabel = document.getElementById('omega');
const vel = new THREE.Vector3();
const pos = new THREE.Vector3();
const col = new THREE.Color();
let simTime = 0;
let singularity = 0; // intensité croissante

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  // Intensité de la singularité : augmente puis pulse (représente |ω(0)|→∞)
  singularity = 1.0 + 2.0 * (0.5 + 0.5*Math.sin(simTime*0.6));
  // Valeur affichée croissante (démonstration)
  const omegaVal = (10 * (1 + 9 * (0.5+0.5*Math.sin(simTime*0.6)))).toFixed(1);
  omegaLabel.textContent = omegaVal;

  // animation du halo / glow
  const pulse = 1.0 + 0.35*Math.sin(simTime*4.0);
  glow.scale.setScalar(0.45 * pulse * (1 + singularity*0.15));
  halo.scale.setScalar(1.15 * pulse);
  glowMat.opacity = 0.55 + 0.35*Math.sin(simTime*3.0);

  // rotation lente du vortex
  vortexGroup.rotation.y += dt * 0.18;

  // animation des tubes : twist visuel via rotation différentielle
  lineMeshes.forEach((m, i) => {
    m.rotation.y += dt * (0.25 + 0.02*(i%5));
    m.material.opacity = 0.45 + 0.4*Math.abs(Math.sin(simTime*1.2 + i*0.5));
  });

  // champ de vitesse des particules
  for (let i = 0; i < P_COUNT; i++) {
    pos.set(pPos[i*3], pPos[i*3+1], pPos[i*3+2]);

    // vitesse bornée
    velocityAt(pos, simTime + pSeed[i], vel);
    // clamp de la vitesse pour rester bornée (Théorème 1.1)
    const sp = vel.length();
    const MAX_SPEED = 1.6;
    if (sp > MAX_SPEED) vel.multiplyScalar(MAX_SPEED/sp);

    pos.addScaledVector(vel, dt * 0.9);

    // proximité au pôle -> couleur chaude + accélération de la vie
    const distPole = Math.acos(THREE.MathUtils.clamp(pos.y / (pos.length()+1e-6), -1, 1));
    const heat = THREE.MathUtils.clamp(1 - distPole/0.9, 0, 1); // 1 près du pôle

    // recyclage si sortie de la sphère ou vie finie
    pLife[i] += dt * (0.15 + heat*0.9);
    const outside = pos.length() > R*1.6 || pos.length() < R*0.28;
    if (outside || pLife[i] > 1 || distPole < 0.04) {
      respawn(i);
      pos.set(pPos[i*3], pPos[i*3+1], pPos[i*3+2]);
      continue;
    }

    pPos[i*3] = pos.x; pPos[i*3+1] = pos.y; pPos[i*3+2] = pos.z;

    // couleur : cyan loin, magenta/rouge près du pôle
    col.setHSL(0.58 - 0.42*heat, 0.9, 0.35 + 0.45*heat);
    pCol[i*3] = col.r; pCol[i*3+1] = col.g; pCol[i*3+2] = col.b;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;

  // la sphère wireframe pulse légèrement avec la vorticité
  const s = 1 + 0.012*Math.sin(simTime*2.0)*singularity;
  sphereWire.scale.setScalar(s);

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ---------- Redimensionnement ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
